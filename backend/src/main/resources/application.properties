spring.application.name=stockpulse
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:mem:stockpulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jackson.deserialization.accept-float-as-int=false

# Reserved for the future Groq client; no API calls are made by the current backend.
stockpulse.groq.api-key=${GROQ_API_KEY:}
stockpulse.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
stockpulse.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
stockpulse.groq.timeout=${GROQ_TIMEOUT:20s}
